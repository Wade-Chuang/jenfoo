<style>
/* 版面：左邊出題控制台（桌機黏住）＋右邊 A4 試卷預覽；手機上下堆疊。試卷本身永遠是白紙。 */
:root{
  --bg:#F6F3EB; --panel:#FFFFFF; --ink:#1B2430; --muted:#5B6573; --line:#E2DCCD;
  --gold:#C69E46; --gold-ink:#8A6A22; --navy:#1B2430; --cream:#F6F3EB;
  --chip:#EFE9DB; --chip-on:#1B2430; --chip-on-ink:#F6F3EB; --shadow:0 1px 2px rgba(27,36,48,.08),0 8px 28px rgba(27,36,48,.10);
  --paper:#FFFFFF; --paper-ink:#141414; --paper-soft:#6A6A6A; --paper-line:#BDBDBD;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-paper:"Noto Serif TC","PMingLiU","Songti TC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121922; --panel:#1C2531; --ink:#ECE6D8; --muted:#9BA5B2; --line:#2D3846;
  --gold:#E0BE6E; --gold-ink:#E0BE6E; --chip:#253041; --chip-on:#E0BE6E; --chip-on-ink:#1B2430;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121922; --panel:#1C2531; --ink:#ECE6D8; --muted:#9BA5B2; --line:#2D3846;
  --gold:#E0BE6E; --gold-ink:#E0BE6E; --chip:#253041; --chip-on:#E0BE6E; --chip-on-ink:#1B2430;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.topbar{background:var(--navy);color:var(--cream);padding-block:14px;padding-inline:16px}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.35rem;letter-spacing:.06em;line-height:1.2}
.brand p{margin:0;font-size:.8rem;color:#C9C2B0;letter-spacing:.08em}
.topbar .cta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:#E9E2D0}
.topbar .cta b{color:#E0BE6E;font-weight:700;letter-spacing:.04em}

.wrap{max-width:1240px;margin:0 auto}
.main{padding-inline:16px;padding-block:22px 40px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 28px);overflow:auto}
@media (max-width:900px){.panel{position:static;max-height:none}}
.step{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step h2{margin:0;font-size:.78rem;letter-spacing:.14em;color:var(--gold-ink);font-weight:700}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clear-all{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.8rem;cursor:pointer}
.clear-all:hover{border-color:var(--gold);color:var(--gold-ink)}
.empty-sheet{font-family:var(--f-body);color:var(--paper-soft);text-align:center;padding:30mm 0;line-height:2}
.grade{display:grid;gap:6px}
.grade-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.95rem;cursor:pointer;list-style:none;padding:6px 2px;border-radius:6px}
.grade-head::-webkit-details-marker{display:none}
.grade-head>span::before{content:'▸';display:inline-block;width:1.1em;color:var(--gold-ink);transition:transform .15s}
details[open]>.grade-head>span::before{transform:rotate(90deg)}
.grade-head em{font-style:normal;font-weight:500;font-size:.75rem;color:var(--gold-ink);margin-left:.6em}
#unitList{display:grid;gap:2px}
.grade-head button{border:0;background:none;color:var(--gold-ink);font-size:.8rem;cursor:pointer;padding:2px 4px}
.units{display:grid;gap:4px}
.unit{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.92rem}
.unit:hover{background:var(--chip)}
.unit input{width:17px;height:17px;accent-color:var(--gold);flex:none;margin:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:7px 4px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:700}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.actions{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.btn.primary{background:var(--gold);color:#1B2430}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.seed{display:flex;gap:6px}
.seed input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.seed button{flex:none}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--gold);width:16px;height:16px;margin:0}
.note{font-size:.78rem;color:var(--muted);background:var(--chip);border-radius:6px;padding:8px 10px;margin:0}

.stage{display:grid;gap:22px;min-width:0}
.tips{margin-top:14px;padding:14px 14px 10px;border-radius:8px;background:var(--chip);border:1px solid var(--line)}
.tips h2{margin:0 0 8px;font-size:.85rem;letter-spacing:.1em;color:var(--gold-ink);font-weight:700}
.tips h2 em{font-style:normal;color:var(--ink);margin-left:6px;letter-spacing:0}
.tips ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.tips li{font-size:.86rem;line-height:1.55;padding-left:1.3em;position:relative}
.tips li::before{content:"📌";position:absolute;left:0;top:0;font-size:.8em}
.tips li b{color:var(--ink)}
.stage-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.stage-bar a{color:var(--gold-ink);text-decoration:none;font-weight:700}
.stage-bar a:hover{text-decoration:underline}

/* ---------- 試卷（白紙） ---------- */
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:210mm;margin:0 auto;padding:14mm 13mm 16mm;box-shadow:var(--shadow);border-radius:2px;font-family:var(--f-paper);font-size:11.5pt;line-height:1.5;color-scheme:light}
.paper .mhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-bottom:8px;border-bottom:2.5px solid var(--paper-ink)}
.paper .mhead svg.logo{width:42px;height:42px}
.paper .mtitle{text-align:center;min-width:0}
.paper .mtitle .school{font-family:var(--f-body);font-size:9pt;letter-spacing:.3em;color:var(--paper-soft)}
.paper .mtitle h3{margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:19pt;letter-spacing:.18em;text-wrap:balance}
.paper .qr{display:flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:7.5pt;line-height:1.35;color:var(--paper-soft);text-align:right}
.paper .qr .code{width:15mm;height:15mm;flex:none}
.paper .qr .code svg{width:100%;height:100%;display:block}
.paper .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px;border-bottom:.6px solid var(--paper-ink);font-family:var(--f-body);font-size:9pt;color:#333}
.paper .meta span{font-variant-numeric:tabular-nums}
.paper .fields{display:flex;gap:14px;flex-wrap:wrap;padding-block:9px 4px;font-family:var(--f-body);font-size:10pt}
.paper .fields span{display:inline-flex;align-items:flex-end;gap:4px}
.paper .fields i{display:inline-block;border-bottom:.6px solid var(--paper-ink);height:1.1em;font-style:normal}
.paper .sec{grid-column:1/-1;margin:5mm 0 1mm;font-size:11.5pt;font-weight:700;break-after:avoid}
.paper .sec small{font-weight:500;font-size:10.5pt;margin-left:.5em}
.qs{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
.q{display:flex;gap:2mm;align-items:baseline;padding-top:2.5mm;break-inside:avoid;min-width:0}
.q .no{font-weight:700;flex:none;min-width:7mm;font-variant-numeric:tabular-nums}
.q .body{min-width:0;overflow-wrap:anywhere}
.q .figwrap{float:right;margin:0 0 2mm 3mm;line-height:0}
.q .fig{width:38mm;height:auto;color:#111;display:block}
.q .fig.wide{width:42mm}
.fig text{stroke:none;fill:currentColor;font-family:"Times New Roman","Noto Serif TC",serif;font-size:10px}
.fig text.it{font-style:italic}

.q .body::after{content:"";display:block;clear:both}
.q .tag{font-family:var(--f-body);font-size:7pt;color:var(--paper-soft);border:.5px solid var(--paper-line);border-radius:2px;padding:0 3px;margin-left:4px;vertical-align:middle;white-space:nowrap}
.paper.ans .aq{display:grid;grid-template-columns:repeat(auto-fill,minmax(52mm,1fr));gap:2mm 6mm}
.paper.ans .a{display:flex;gap:2mm;align-items:baseline;break-inside:avoid;min-width:0;padding-block:1mm}
.paper.ans .a .no{font-weight:700;min-width:7mm;flex:none;font-variant-numeric:tabular-nums}
.paper.ans .a .body{min-width:0;overflow-wrap:anywhere}
.paper .cta-box{margin-top:8mm;border:1.2px solid var(--paper-ink);display:grid;grid-template-columns:auto 1fr;gap:5mm;align-items:center;padding:4mm 5mm;font-family:var(--f-body);break-inside:avoid}
.paper .cta-box .code{width:24mm;height:24mm}
.paper .cta-box .code svg{width:100%;height:100%;display:block}
.paper .cta-box b{font-size:13pt;letter-spacing:.06em}
.paper .cta-box p{margin:1mm 0 0;font-size:9.5pt;color:#333}
.paper .foot{margin-top:6mm;padding-top:2mm;border-top:.6px solid var(--paper-line);font-family:var(--f-body);font-size:7.5pt;color:var(--paper-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.paper mjx-container{color:var(--paper-ink)}
.paper mjx-container[jax="SVG"]{direction:ltr}
.loading{font-family:var(--f-body);color:var(--paper-soft);text-align:center;padding:30mm 0}
.raw{font-family:ui-monospace,Consolas,monospace;font-size:.9em}

@media (max-width:620px){
  .paper{padding:8mm 5mm 10mm;font-size:11pt}
  .qs{grid-template-columns:1fr}
  .paper .mhead{grid-template-columns:auto 1fr}
  .paper .mhead .qr{display:none}
  .paper .mtitle h3{font-size:16pt;letter-spacing:.1em}
}

.sitefoot{border-top:1px solid var(--line);padding-block:20px;padding-inline:16px;color:var(--muted);font-size:.85rem}
.sitefoot .wrap{display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:space-between}
.visits{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;font-weight:700;color:var(--ink);background:var(--chip);border:1px solid var(--gold);border-radius:999px;padding:5px 15px}
.visits b{font-size:1.35rem;line-height:1;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.sitefoot .wrap{align-items:center}

.vids{background:var(--card,#fff);border:1px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px}
.vids h2{font-size:1.05rem;margin:0 0 4px}
.vids .vsub{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcard{display:block;text-decoration:none;color:inherit;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.vcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#1B2430}
.vcard span{display:block;padding:8px 10px;font-size:.88rem;line-height:1.4}
.vcard em{font-style:normal;font-size:.75rem;font-weight:700;color:var(--gold-ink);margin-right:4px}
.vcta{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.vcta p{margin:0 0 10px;font-size:.92rem}
.vbtns{display:flex;flex-wrap:wrap;gap:10px}
.vbtn{display:inline-block;padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;font-size:.9rem;text-decoration:none;border:0;cursor:pointer;color:#fff}
.vbtn.sub{background:#c4302b}.vbtn.share{background:#1B2430}.vbtn.line{background:#06c755}
#vmsg{margin:8px 0 0;font-size:.85rem;color:var(--gold-ink)}
.cta-box .code.yt{margin-left:6px}

@media print{
  @page{size:A4;margin:11mm 11mm 12mm}
  :root{color-scheme:light}
  body{background:#fff}
  .topbar,.panel,.stage-bar,.sitefoot,.vids{display:none!important}
  .main{padding:0}
  .layout{display:block}
  .paper{box-shadow:none;max-width:none;width:auto;padding:0;margin:0;border-radius:0}
  .paper.ans{break-before:page;margin-top:0}
  .stage{display:block}
  body.no-ans .paper.ans{display:none}
  .qs{grid-template-columns:1fr 1fr!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* 瀏覽人次（不蒜子）：數字回來才顯示，服務沒回應就整行不出現。換網域時把舊網址的累計人次填進 OFFSET 接續 */
(function(){var OFFSET=0,n=0,t=setInterval(function(){var el=document.getElementById('busuanzi_value_page_pv'),v=parseInt(el&&el.textContent,10);
  if(v>0){clearInterval(t);el.textContent=(v+OFFSET).toLocaleString('en-US');document.getElementById('visits').hidden=false}else if(++n>40)clearInterval(t)},500)})();
</script>
<script>
/* ================= 亂數與數學小工具 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const rnz=(a,b)=>{let v;do v=ri(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(R()*a.length)];
const sgn=()=>R()<.5?-1:1;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const P=x=>x<0?`(${x})`:`${x}`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function F(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}}
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d), fsub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d),
      fmul=(a,b)=>F(a.n*b.n,a.d*b.d), fdiv=(a,b)=>F(a.n*b.d,a.d*b.n);
const ftex=f=>f.d===1?`${f.n}`:(f.n<0?`-\\frac{${-f.n}}{${f.d}}`:`\\frac{${f.n}}{${f.d}}`);
const fP=f=>f.n<0?`\\left(${ftex(f)}\\right)`:ftex(f);
function mixtex(f){const s=f.n<0?'-':'',N=Math.abs(f.n),w=Math.floor(N/f.d),r=N%f.d;return r?`${s}${w}\\frac{${r}}{${f.d}}`:`${s}${w}`}
/* 依序印出多項式各項：[[係數,'x^2'],[係數,'x'],[係數,'']] */
function poly(terms){let s='';for(const [c,v] of terms){if(c===0)continue;const ab=Math.abs(c);const body=v?(ab===1?v:ab+v):String(ab);s+=s===''?(c<0?'-':'')+body:(c<0?' - ':' + ')+body}return s||'0'}
const lin=(a,b,v='x')=>poly([[a,v],[b,'']]);
const quad=(a,b,c)=>poly([[a,'x^2'],[b,'x'],[c,'']]);
const dec1=p=>p%10===0?String(p/10):`${Math.floor(p/10)}.${p%10}`;
const commas=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'{,}');
function sqrtSimp(n){for(let i=Math.floor(Math.sqrt(n));i>=2;i--)if(n%(i*i)===0)return[i,n/(i*i)];return[1,n]}
function rad(k,m){if(m===1)return`${k}`;if(k===1)return`\\sqrt{${m}}`;if(k===-1)return`-\\sqrt{${m}}`;return`${k}\\sqrt{${m}}`}
const isSq=n=>Number.isInteger(Math.sqrt(n));
const roots2=(a,b)=>a===b?`$x = ${a}$（重根）`:`$x = ${a}$ 或 $x = ${b}$`;

/* ================= 題型產生器 =================
   每個單元的 gen(難度) 回傳 {q:題目, a:答案}，字串裡 $…$ 為數學式；回傳 null 代表重抽。 */
const U=[];
const unit=o=>U.push(o);

unit({id:'int-add',g:'七上',name:'正負數的加減',instr:'計算下列各式的值。',h:[14,18,24],gen(d){
  const EX=(L,ans)=>L.map((s,i)=>'①②③④⑤'[i]+' '+s).join('\n')+'\n所以答案是 '+ans+'。';
  const tag=(x,y)=>x===0||y===0?'（$0$ 加任何數，結果不變）':(x<0)===(y<0)?'（同號相加：絕對值相加，符號不變）':'（異號相加：絕對值大減小，取絕對值大的符號）';
  const n=[0,2,3,4][d],M=[0,20,60,30][d];let tex='',val=0,neg=false;const cs=[],ab=[];
  for(let i=0;i<n;i++){
    let tt,tv;
    if(d===3&&i>0&&R()<.4){const a=rnz(-15,15),b=rnz(-15,15);tv=Math.abs(a-b);tt=`\\left|${a} - ${P(b)}\\right|`;neg=true;ab.push([tt,a-b,tv])}
    else{tv=rnz(-M,M);tt=i===0?String(tv):P(tv);if(tv<0)neg=true}
    if(i===0){tex=tt;val=tv;cs.push(tv)}else{const op=R()<.5?'+':'-';tex+=` ${op} ${tt}`;val+=op==='+'?tv:-tv;cs.push(op==='+'?tv:-tv)}
  }
  if(!neg)return null;
  const L=[];
  if(ab.length)L.push(`先算絕對值：$${ab.map(([t,m,v])=>ab.length===1?`${t} = \\left|${m}\\right| = ${v}`:`${t} = ${v}`).join('$、$')}$。`);
  L.push(`減去一個數等於加上它的相反數，全部改成加法：$${cs.map((c,i)=>i?P(c):c).join(' + ')}$。`);
  let run=cs[0];
  for(let i=1;i<cs.length;i++){L.push(`${i===1?'由左往右算':'再算'}：$${run} + ${P(cs[i])} = ${run+cs[i]}$${tag(run,cs[i])}。`);run+=cs[i]}
  return{q:`$${tex}$`,a:`$${val}$`,e:EX(L,`$${val}$`)};
}});

unit({id:'int-mul',g:'七上',name:'正負數的乘除與四則運算',instr:'計算下列各式的值。',h:[14,20,28],gen(d){
  const EX=(L,ans)=>L.map((s,i)=>'①②③④⑤'[i]+' '+s).join('\n')+'\n所以答案是 '+ans+'。';
  const sg=(x,y)=>(x<0)===(y<0)?'同號得正':'異號得負';
  const sub=(x,y)=>`${x} - ${P(y)}${y<0?` = ${x} + ${-y}`:''} = ${x-y}`;
  if(d===1){
    if(R()<.5){const a=rnz(-12,12),b=rnz(-12,12);if(a>0&&b>0||Math.abs(a)<2||Math.abs(b)<2)return null;const k=(a<0)+(b<0);
      return{q:`$${a} \\times ${P(b)}$`,a:`$${a*b}$`,e:EX([`先決定正負：負數有 ${k} 個，${k%2?'奇':'偶'}數個負數相乘，積為${a*b<0?'負':'正'}。`,`再算絕對值相乘：$${Math.abs(a)} \\times ${Math.abs(b)} = ${Math.abs(a*b)}$。`,`加上符號：$${a} \\times ${P(b)} = ${a*b}$。`],`$${a*b}$`)}}
    const b=pick([2,3,4,5,6,7,8,9])*sgn(),q=rnz(-12,12),a=b*q;if(a>0&&b>0)return null;
    return{q:`$${a} \\div ${P(b)}$`,a:`$${q}$`,e:EX([`先決定正負：$${a}$ 和 $${b}$ ${q<0?'異號，商為負':'同號，商為正'}。`,`再算絕對值相除：$${Math.abs(a)} \\div ${Math.abs(b)} = ${Math.abs(q)}$（因為 $${Math.abs(b)} \\times ${Math.abs(q)} = ${Math.abs(a)}$）。`,`加上符號：$${a} \\div ${P(b)} = ${q}$。`],`$${q}$`)};
  }
  if(d===2){
    const f=ri(0,2);
    if(f===0){const a=rnz(-30,30),b=rnz(-9,9),c=rnz(-9,9);
      return{q:`$${a} + ${P(b)} \\times ${P(c)}$`,a:`$${a+b*c}$`,e:EX([`先乘除後加減，所以先算 $${P(b)} \\times ${P(c)}$。`,`$${P(b)} \\times ${P(c)} = ${b*c}$（${sg(b,c)}）。`,`再算加法：$${a} + ${P(b*c)} = ${a+b*c}$。`],`$${a+b*c}$`)}}
    if(f===1){const a=rnz(-15,15),b=rnz(-12,12),c=pick([2,3,4,5,6,8])*sgn();if((a*b)%c)return null;const v=a*b/c;if(Math.abs(v)>80)return null;
      return{q:`$${a} \\times ${P(b)} \\div ${P(c)}$`,a:`$${v}$`,e:EX([`只有乘和除，由左往右算。`,`先乘：$${a} \\times ${P(b)} = ${a*b}$（${sg(a,b)}）。`,`再除：$${a*b} \\div ${P(c)} = ${v}$（${sg(a*b,c)}）。`],`$${v}$`)}}
    const a=rnz(-15,15),b=rnz(-15,15),c=rnz(-9,9);
    return{q:`$\\left(${a} - ${P(b)}\\right) \\times ${P(c)}$`,a:`$${(a-b)*c}$`,e:EX([`有括號先算括號裡面。`,`$${sub(a,b)}$。`,`再乘：$${P(a-b)} \\times ${P(c)} = ${(a-b)*c}$${a-b===0?'（$0$ 乘任何數都是 $0$）':`（${sg(a-b,c)}）`}。`],`$${(a-b)*c}$`)};
  }
  if(R()<.5){const D=pick([2,3,4,5,6,7])*sgn(),q=rnz(-9,9),B=rnz(-9,9),C=rnz(-9,9),A=q*D+B*C;if(A===0||Math.abs(A)>99)return null;
    return{q:`$\\left[${A} - ${P(B)} \\times ${P(C)}\\right] \\div ${P(D)}$`,a:`$${q}$`,e:EX([`先算中括號裡面，裡面要先乘後減。`,`先乘：$${P(B)} \\times ${P(C)} = ${B*C}$（${sg(B,C)}）。`,`再減：$${sub(A,B*C)}$。`,`最後除：$${A-B*C} \\div ${P(D)} = ${q}$。`],`$${q}$`)}}
  const a=rnz(-30,30),b=rnz(-9,9),c=rnz(-12,12),e=rnz(-12,12),f=pick([2,3,4,5,6])*sgn(),inner=b*(c-e);if(inner%f||c===e)return null;
  return{q:`$${a} - ${P(b)} \\times \\left(${c} - ${P(e)}\\right) \\div ${P(f)}$`,a:`$${a-inner/f}$`,e:EX([`先算括號：$${sub(c,e)}$。`,`再由左往右乘除，先乘：$${P(b)} \\times ${P(c-e)} = ${inner}$（${sg(b,c-e)}）。`,`再除：$${inner} \\div ${P(f)} = ${inner/f}$。`,`最後減：$${sub(a,inner/f)}$。`],`$${a-inner/f}$`)};
}});

function powTerm(maxB,maxE){const b=ri(2,maxB),e=ri(2,maxE),t=ri(0,2);
  if(t===0)return{t:`(-${b})^{${e}}`,v:(-b)**e,lead:false};
  if(t===1)return{t:`-${b}^{${e}}`,v:-(b**e),lead:true};
  return{t:`${b}^{${e}}`,v:b**e,lead:false}}
unit({id:'power',g:'七上',name:'指數與科學記號',instr:'計算下列各式的值，或依題意作答。',h:[14,18,22],gen(d){
  const EX=(L,ans)=>L.map((s,i)=>'①②③④⑤'[i]+' '+s).join('\n')+'\n所以答案是 '+ans+'。';
  const pp=t=>{const m=t.t.match(/(\d+)\)?\^\{(\d+)\}/);return{b:+m[1],x:+m[2]}};
  const pe=t=>{const {b,x}=pp(t),rep=s=>Array(x).fill(s).join(' \\times ');
    return t.lead?`$${t.t} = -(${rep(b)}) = -${b**x}$（負號在次方外面，先算 $${b}^{${x}}$ 再加負號）`
      :t.t[0]==='('?`$${t.t} = ${rep(`(-${b})`)} = ${t.v}$（${x} 個負數相乘，結果為${x%2?'負':'正'}）`
      :`$${t.t} = ${rep(b)} = ${t.v}$`};
  const base=t=>{const {b,x}=pp(t);return t.lead?`看清楚底數：負號在次方外面，底數是 $${b}$，算完再加負號。`:t.t[0]==='('?`看清楚底數：括號裡的 $-${b}$ 整個是底數，要連乘 ${x} 次。`:`$${b}^{${x}}$ 表示 ${x} 個 $${b}$ 相乘。`};
  if(d===1){
    if(R()<.25){const n=ri(10,99),v=n%2?-1:1;return{q:`$(-1)^{${n}}$`,a:`$${v}$`,e:EX([`$(-1)^{${n}}$ 表示 ${n} 個 $-1$ 相乘。`,`每兩個 $-1$ 相乘得 $(-1) \\times (-1) = 1$。`,n%2?`$${n}$ 是奇數，兩兩配對後還剩一個 $-1$，結果是 $-1$。`:`$${n}$ 是偶數，剛好全部兩兩配對，結果是 $1$。`],`$${v}$`)}}
    const t=powTerm(5,4);if(Math.abs(t.v)>700)return null;return{q:`$${t.t}$`,a:`$${t.v}$`,e:EX([base(t),`${pe(t)}。`],`$${t.v}$`)};
  }
  if(d===2){
    if(R()<.5){const t1=powTerm(4,3),t2=powTerm(4,3),op=pick(['+','-','\\times']);
      const t2s=t2.lead?`\\left(${t2.t}\\right)`:t2.t;
      const v=op==='+'?t1.v+t2.v:op==='-'?t1.v-t2.v:t1.v*t2.v;if(Math.abs(v)>999)return null;
      const last=op==='-'&&t2.v<0?`${t1.v} - ${P(t2.v)} = ${t1.v} + ${-t2.v} = ${v}`:`${t1.v} ${op} ${P(t2.v)} = ${v}`;
      return{q:`$${t1.t} ${op} ${t2s}$`,a:`$${v}$`,e:EX([`先算次方，再算${op==='+'?'加法':op==='-'?'減法':'乘法'}。`,`${pe(t1)}。`,`${pe(t2)}。`,`再算：$${last}$。`],`$${v}$`)}}
    const d1=ri(1,9);let rest='';const L=ri(1,2);for(let i=0;i<L;i++)rest+=ri(0,9);rest=rest.replace(/0+$/,'');
    const digits=String(d1)+rest,mant=rest?`${d1}.${rest}`:`${d1}`;
    if(R()<.5){const e=ri(4,9),num=digits+'0'.repeat(e+1-digits.length),ans=`$${mant} \\times 10^{${e}}$`;
      return{q:`將 $${commas(num)}$ 以科學記號表示`,a:ans,e:EX([`科學記號要寫成 $a \\times 10^n$，其中 $1 \\leqq a \\lt 10$。`,`把小數點移到第一個數字 $${d1}$ 的後面，得 $a = ${mant}$。`,`$${commas(num)}$ 是 ${e+1} 位數，小數點從最後面向左移了 ${e} 位。`,`向左移 ${e} 位等於除以 $10^{${e}}$，所以要乘回 $10^{${e}}$：$${commas(num)} = ${mant} \\times 10^{${e}}$。`],ans)}}
    const e=-ri(3,6),num='0.'+'0'.repeat(-e-1)+digits,ans=`$${mant} \\times 10^{${e}}$`;
    return{q:`將 $${num}$ 以科學記號表示`,a:ans,e:EX([`科學記號要寫成 $a \\times 10^n$，其中 $1 \\leqq a \\lt 10$。`,`把小數點移到第一個不是 $0$ 的數字 $${d1}$ 後面，得 $a = ${mant}$。`,`小數點向右移了 ${-e} 位（數一數：小數點到 $${d1}$ 共 ${-e} 位）。`,`向右移 ${-e} 位等於乘以 $10^{${-e}}$，所以要乘回 $10^{${e}}$：$${num} = ${mant} \\times 10^{${e}}$。`],ans)};
  }
  /* 難度3：指數律（N-7-7，以數字例、指數為非負整數；不出負指數，不出科學記號四則運算） */
  const f=ri(0,4),a=pick([2,3,5,7]);
  if(f===0){const m=ri(2,9),k=ri(2,9),n=m+k,ans=`$n = ${n}$`;
    return{q:`求 $n$：$${a}^{${m}} \\times ${a}^{${k}} = ${a}^{n}$`,a:ans,e:EX([`同底數相乘，底數不變、指數相加：$a^m \\times a^n = a^{m+n}$。`,`$${a}^{${m}}$ 是 ${m} 個 $${a}$ 相乘，$${a}^{${k}}$ 是 ${k} 個 $${a}$ 相乘，合起來共 ${m} + ${k} 個。`,`$${a}^{${m}} \\times ${a}^{${k}} = ${a}^{${m} + ${k}} = ${a}^{${n}}$，所以 $n = ${n}$。`],ans)}}
  if(f===1){const m=ri(2,6),k=ri(2,5),n=m*k,ans=`$n = ${n}$`;
    return{q:`求 $n$：$(${a}^{${m}})^{${k}} = ${a}^{n}$`,a:ans,e:EX([`次方的次方，底數不變、指數相乘：$(a^m)^n = a^{m \\times n}$。`,`$(${a}^{${m}})^{${k}}$ 是 ${k} 個 $${a}^{${m}}$ 相乘，指數相加 ${k} 次 $${m}$。`,`$(${a}^{${m}})^{${k}} = ${a}^{${m} \\times ${k}} = ${a}^{${n}}$，所以 $n = ${n}$。`],ans)}}
  if(f===2){const k=ri(2,8),n=ri(1,8),m=k+n,ans=`$n = ${n}$`;
    return{q:`求 $n$：$${a}^{${m}} \\div ${a}^{${k}} = ${a}^{n}$`,a:ans,e:EX([`同底數相除，底數不變、指數相減：$a^m \\div a^n = a^{m-n}$（$m \\geqq n$）。`,`$${a}^{${m}}$ 有 ${m} 個 $${a}$，除掉 ${k} 個 $${a}$，剩下 ${m} - ${k} 個。`,`$${a}^{${m}} \\div ${a}^{${k}} = ${a}^{${m} - ${k}} = ${a}^{${n}}$，所以 $n = ${n}$。`],ans)}}
  if(f===3){const [x,y,b,t]=pick([[2,5,10,1],[4,25,100,2],[20,5,100,2],[25,4,100,2],[5,2,10,1]]),k=ri(2,6),n=k*t,ans=`$n = ${n}$`;
    return{q:`求 $n$：$${x}^{${k}} \\times ${y}^{${k}} = 10^{n}$`,a:ans,e:EX([`指數相同時可以先把底數相乘：$a^n \\times b^n = (a \\times b)^n$。`,`$${x}^{${k}} \\times ${y}^{${k}} = (${x} \\times ${y})^{${k}} = ${b}^{${k}}$。`,t===1?`$${b}^{${k}} = 10^{${k}}$，所以 $n = ${k}$。`:`$100 = 10^{2}$，所以 $100^{${k}} = (10^{2})^{${k}} = 10^{2 \\times ${k}} = 10^{${n}}$，所以 $n = ${n}$。`],ans)}}
  const [b,p]=a===2?pick([[4,2],[8,3]]):a===3?[9,2]:a===5?[25,2]:[49,2],u=ri(2,7),v=ri(2,4),w=ri(0,3),n=u+p*v-w;if(n<1)return null;const ans=`$n = ${n}$`;
  const qq=w?`${a}^{${u}} \\times ${b}^{${v}} \\div ${a}^{${w}}`:`${a}^{${u}} \\times ${b}^{${v}}`;
  return{q:`求 $n$：$${qq} = ${a}^{n}$`,a:ans,e:EX([`先把底數化成相同：$${b} = ${a}^{${p}}$，所以 $${b}^{${v}} = (${a}^{${p}})^{${v}} = ${a}^{${p*v}}$。`,`原式 $= ${a}^{${u}} \\times ${a}^{${p*v}}${w?` \\div ${a}^{${w}}`:''}$。`,`同底數相乘指數相加${w?'、相除指數相減':''}：$${a}^{${u} + ${p*v}${w?` - ${w}`:''}} = ${a}^{${n}}$。`,`所以 $n = ${n}$。`],ans)};
}});

function factorTex(n){const ps=[];let m=n;for(let p=2;p*p<=m;p++){let e=0;while(m%p===0){m/=p;e++}if(e)ps.push(e>1?`${p}^{${e}}`:`${p}`)}if(m>1)ps.push(`${m}`);return ps}
unit({id:'factor-num',g:'七上',name:'質因數分解・公因數與公倍數',instr:'依題意作答。',h:[18,22,26],gen(d){
  const EX=(L,ans)=>L.map((s,i)=>'①②③④⑤'[i]+' '+s).join('\n')+'\n所以答案是 '+ans+'。';
  const pf=x=>{const r=[];for(let p=2;p<=x;p++)while(x%p===0){r.push(p);x/=p}return r};
  const chain=(arr,ds)=>{let cur=arr.slice(),s=`(${cur.join(', ')})`;for(const p of ds){cur=cur.map(v=>v%p===0?v/p:v);s+=` \\to (${cur.join(', ')})`}return s};
  if(d===1){const n=2**ri(0,4)*3**ri(0,3)*5**ri(0,2)*7**ri(0,1)*(R()<.2?11:1);const ps=factorTex(n);
    if(n<30||n>900||ps.length<2)return null;
    const L=[`用質數由小到大連續去除 $${n}$（短除法），除到剩 $1$ 為止。`];let m=n;
    for(const p of [2,3,5,7,11]){if(m%p)continue;const seq=[m];let c=0;while(m%p===0){m/=p;seq.push(m);c++}L.push(`用 $${p}$ 連除 ${c} 次：$${seq.join(' \\to ')}$。`)}
    const ans=`$${n} = ${ps.join(' \\times ')}$`;
    return{q:`求 $${n}$ 的標準分解式`,a:ans,e:EX(L,`${ans}（相同的質因數寫成次方）`)}}

unit({id:'centers',g:'九上',name:'幾何推理：三角形的外心、內心與重心',instr:'依題意作答。',h:[18,22,28],gen(d){

    return{q:`${c.map(([v,n])=>`$${n}$ 個 $${v}$ 元`).join('、')}，一共是多少元？`,a:`$${c.reduce((s,[v,n])=>s+v*n,0)}$ 元`}}

const e3_t=t=>t%10===0?String(t/10):`${Math.floor(t/10)}.${t%10}`;            // 以「十分位整數」表示的一位小數
function e3_clock(min){const h=Math.floor(min/60)%24,m=min%60;const pre=h<12?'上午':(h===12?'中午':'下午'),hh=h>12?h-12:h;return`${pre} ${hh} 點${m?` ${m} 分`:''}`}
function e3_hm(min){const h=Math.floor(min/60),m=min%60;return h&&m?`$${h}$ 小時 $${m}$ 分`:h?`$${h}$ 小時`:`$${m}$ 分`}
function e3_two(v,base,big,small){const a=Math.floor(v/base),b=v%base;return a&&b?`$${a}$ ${big} $${b}$ ${small}`:a?`$${a}$ ${big}`:`$${b}$ ${small}`}

/* ---------- 國小 ---------- */
/* ================= 國小數學（小四・小五・小六）=================
   單元一覽與手算驗證範例（基礎 / 標準 / 挑戰）：
   e-muldiv  小四 多位數的乘法與除法：379×7→2653 / 1781÷29→商61餘12 / 一箱41瓶，215箱→8815瓶
   e-approx  小四 概數與估算：7592四捨五入到十位→7590 / 394922到千位→395000 / 電扇102元買28臺，取最高位估算→約3000元
   e-frac4   小四 同分母分數加減・帶分數與假分數：14/5→2又4/5 / 2又4/5+1/5→3 / 緞帶7又5/7−2又4/7−6/7→4又2/7公尺
   e-ops     小五 整數四則混合計算：11−3×2→5 / 53+54÷9×3→71 / 20×24−36÷9+88→564
   e-factor  小五 因數與倍數：1到50中13的倍數→3個 / 8和72→最大公因數8、最小公倍數72 / 蘋果26橘子117平分→13位，每人2顆、9顆
   e-frac5   小五 擴分、約分與異分母分數加減：48/56→6/7 / 3/5−2/11→23/55 / 2/5+5/12+1又5/12→2又7/30
   e-fracmul 小五 分數的乘法：2/3×13→8又2/3 / 1又1/2×11→16又1/2 / 2又1/4×2又5/6→6又3/8
   e-decmul  小五 小數的乘法：6.2×7→43.4 / 4.65×0.7→3.255 / 長3.1寬1.7公尺→5.27平方公尺
   e-area    小五 三角形・平行四邊形・梯形的面積（附圖）：平行四邊形底8高5→40 / 平行四邊形面積77、底11，求高→7 / 直角三角形兩股8、6，斜邊10，斜邊上的高→4.8公分
   e-fracdiv 小六 分數的除法：1/5÷3/4→4/15 / 7÷2又2/9→3又3/20 / 鐵條3又1/5公尺重2又1/3公斤，1公尺→35/48公斤
   e-decdiv  小六 小數的除法：7÷2→3.5 / 0.44÷0.2→2.2 / 2.9公斤糖每0.2公斤一包→14包剩0.1公斤
   e-ratio   小六 比與比值・速率：23:25的比值→23/25 / 16分鐘騎3.68公里→分速230公尺 / 時速120公里行駛2小時20分→280公里
   e-circle  小六 圓周長與圓面積：半徑18→1017.36平方公分 / 直徑40的半圓周長→102.8公分 / 圓環外半徑7內半徑4→103.62平方公分
   e-percent 小六 百分率與折扣：360元打9折→324元 / 460元便宜46元→打9折 / 原價860特價516→打6折
*/
/* ---------- 國小 helper（e_ 前綴） ---------- */
const E_P10=[1,10,100,1000,10000,100000,1000000,10000000];
/* 整數 n 代表 n ÷ 10^k，輸出去掉尾端 0 的小數字串 */
const e_dec=(n,k=0)=>{const neg=n<0;let s=String(Math.abs(n));if(k>0){s=s.padStart(k+1,'0');s=(s.slice(0,-k)+'.'+s.slice(-k)).replace(/0+$/,'').replace(/\.$/,'')}return(neg?'-':'')+s};
/* 同上，整數部分加千分位（TeX 用） */
const e_num=(n,k=0)=>{const [i,f]=e_dec(n,k).split('.');return commas(i)+(f?'.'+f:'')};
/* 固定 k 位小數（取概數用，保留尾端 0） */
const e_fix=(n,k)=>{let s=String(n).padStart(k+1,'0');return commas(s.slice(0,-k))+'.'+s.slice(-k)};
/* 小數物件 {n,k} = n ÷ 10^k */
const e_rdec=(lo,hi,k)=>{let n;do n=ri(lo,hi);while(n%10===0);return{n,k}};
const e_ds=x=>e_num(x.n,x.k);
/* 分數答案：整數、真分數或帶分數 */
const e_mix=f=>f.d===1?String(f.n):Math.abs(f.n)<f.d?ftex(f):mixtex(f);
/* 最簡真分數、最簡帶分數 */
const e_proper=dd=>{let n;do n=ri(1,dd-1);while(gcd(n,dd)!==1);return F(n,dd)};
const e_mixed=(dd,wmax=4)=>{const r=e_proper(dd);return F(ri(1,wmax)*dd+r.n,dd)};
/* 正整數 num ÷ den 四捨五入到整數 */
const e_rdiv=(num,den)=>Math.floor((2*num+den)/(2*den));
const e_rnd=(N,p)=>Math.floor((2*N+p)/(2*p))*p;
const e_divs=n=>{const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r};
const E_PLACE={10:'十位',100:'百位',1000:'千位',10000:'萬位'};

unit({id:'e-frac4',g:'小四',name:'同分母分數加減・帶分數與假分數',instr:'依題意作答（答案大於 1 時用帶分數表示）。',h:[16,20,26],gen(d){
  const dd=ri(3,12),cp=n=>gcd(n,dd)===1;
  /* N 代表 N/dd，題目用原分母顯示 */
  const qf=N=>N<dd?`\\frac{${N}}{${dd}}`:N%dd?`${Math.floor(N/dd)}\\frac{${N%dd}}{${dd}}`:`${N/dd}`;
  /* 答案不需約分（小四未學約分）：只接受整數或分子與分母互質 */
  const ans=N=>(N>0&&(N%dd===0||cp(N)))?`$${e_mix(F(N,dd))}$`:null;
  const prop=()=>{const r=ri(1,dd-1);return cp(r)?r:0};
  const mixd=wmax=>{const r=prop();return r?ri(1,wmax)*dd+r:0};
  if(d===1){const f=ri(0,2);
    if(f===0){const n=ri(dd+1,5*dd);if(!cp(n))return null;return{q:`把 $\\frac{${n}}{${dd}}$ 化成帶分數`,a:`$${mixtex(F(n,dd))}$`}}
    if(f===1){const N=mixd(5);if(!N)return null;return{q:`把 $${qf(N)}$ 化成假分數`,a:`$\\frac{${N}}{${dd}}$`}}
    const x=prop(),y=prop();if(!x||!y)return null;const op=R()<.5?'+':'-';if(op==='-'&&x<=y)return null;const A=ans(op==='+'?x+y:x-y);if(!A)return null;
    return{q:`$${qf(x)} ${op} ${qf(y)}$`,a:A};
  }
  if(d===2){
    if(R()<.7){const x=mixd(5),y=R()<.5?mixd(4):prop();if(!x||!y)return null;const op=R()<.5?'+':'-';if(op==='-'&&x<=y)return null;const A=ans(op==='+'?x+y:x-y);if(!A)return null;
      return{q:`$${qf(x)} ${op} ${qf(y)}$`,a:A}}
    const W=ri(1,6),y=R()<.5?prop():mixd(2);if(!y||y>=W*dd)return null;const A=ans(W*dd-y);if(!A)return null;
    return{q:`$${W} - ${qf(y)}$`,a:A};
  }
  if(R()<.5){const x=mixd(6),y=R()<.5?mixd(3):prop(),z=R()<.5?mixd(2):prop();if(!x||!y||!z)return null;const o1=R()<.5?'+':'-',o2=R()<.5?'+':'-';
    const v1=o1==='+'?x+y:x-y;if(v1<=0)return null;const A=ans(o2==='+'?v1+z:v1-z);if(!A)return null;
    return{q:`$${qf(x)} ${o1} ${qf(y)} ${o2} ${qf(z)}$`,a:A}}
  const x=mixd(8),y=mixd(2),z=prop();if(!x||!y||!z)return null;const A=ans(x-y-z);if(!A)return null;
  return{q:`一條緞帶長 $${qf(x)}$ 公尺，第一次用去 $${qf(y)}$ 公尺，第二次用去 $${qf(z)}$ 公尺，還剩下幾公尺？`,a:`${A} 公尺`};
}});

/* ---------- 技高數學C ---------- */
/* ================= 技高數學C（c-） =================
   單元一覽與手算驗證範例（基礎 / 標準 / 挑戰）：
   c-dist     數C一 數線與平面上的距離、中點與分點
              A(4,-6)、B(0,-3) 距離 → 5 ／ |4x+3| = 12 → x = -15/4 或 9/4 ／ A(3,8)、B(-4,1)，x 軸上 PA = PB → P(4, 0)
   c-ineq     數C一 一元二次不等式與絕對值不等式
              x²-8x+7 ≦ 0 → 1 ≦ x ≦ 7 ／ |5x-8| > 5 → x < 3/5 或 x > 13/5 ／ 4 ≦ |x-1| < 5 → -4 < x ≦ -3 或 5 ≦ x < 6
   c-radian   數C一 弳度與扇形的弧長、面積
              -2π/5 → -72° ／ r=6、270° → 弧長 9π、面積 27π ／ r=4、周長 18 → 圓心角 5/2、面積 20
   c-trig     數C一 廣義角的三角函數
              221° → 第三象限角 ／ sinθ=-3/5 第四象限 → cosθ=4/5、tanθ=-3/4 ／ 2sin²315°-3tan²60°+2cos²90° → -8
   c-vec2     數C一 平面向量的運算與內積
              (5,3)·(-5,-6) → -43 ／ |a|=2、|b|=4、a·b=4 → 60° ／ |a|=6、|b|=2、夾角 60°，|-3a-b| → 2√91
   c-poly     數C二 多項式除法、餘式定理與因式定理
              (3x³-3x²+3x+9)÷(x-1) → 商 3x²+3、餘 12 ／ x-2 是 x³-3x²+kx-6 的因式 → k=5 ／ x³-4x²-3x+18 → (x+2)(x-3)²
   c-fracrad  數C二 分式與根式的化簡
              10/√45 → 2√5/3 ／ 8/(1-√5) → -2-2√5 ／ 4/(√7+√3) → √7-√3
   c-line     數C二 直線的斜率與方程式、點到直線距離
              5x-2y-12=0 → 斜率 5/2、y 截距 -6 ／ P(5,-2) 到 3x+4y+6=0 → 13/5 ／ A(0,4)、B(-2,0) 垂直平分線 → x+2y-3=0
   c-circle   數C二 圓的方程式
              (x-6)²+(y+2)²=3 → 圓心(6,-2)、半徑√3 ／ x²+y²+4x+10y-9=0 → 圓心(-2,-5)、半徑√38 ／ 直徑 A(-1,-4)、B(-7,-4) → (x+4)²+(y+4)²=9

/* 高斯消去法的逐步詳解（M 為係數、X 為解） */
function hx_gauss(M,X){
  const rows=M.map(r=>[...r,r[0]*X[0]+r[1]*X[1]+r[2]*X[2]]);
  const eqT=r=>`${poly([[r[0],'x'],[r[1],'y'],[r[2],'z']])} = ${r[3]}`;
  const red=r=>{const g=r.reduce((s,x)=>gcd(s,x),0)||1,lead=r.slice(0,3).find(x=>x!==0),s=lead<0?-1:1;return r.map(x=>x/g*s+0)};
  const mul=(lab,k)=>k===1?`(${lab})`:`(${lab}) \\times ${h_pp(k)}`;
  const elim=(rj,lj,rp,lp,k,lab)=>{if(rj[k]===0)return{r:rj,t:`(${lj}) 本來就沒有 $${'xyz'[k]}$，直接記為 (${lab})：$${eqT(rj)}$`};
    const l=lcm(Math.abs(rj[k]),Math.abs(rp[k])),cj=l/rj[k],cp=l/rp[k],r=red(rj.map((x,i)=>cj*x-cp*rp[i]));
    return{r,t:`$${mul(lj,cj)} - ${mul(lp,cp)}$，整理得 (${lab})：$${eqT(r)}$`}};
  const L=[`三式依序記為 (1)、(2)、(3)，先消去 $x$，再消去 $y$，最後回代。`];
  const cx=[0,1,2].filter(i=>rows[i][0]!==0),p=cx.reduce((b,i)=>Math.abs(rows[i][0])<Math.abs(rows[b][0])?i:b,cx[0]),oth=[0,1,2].filter(i=>i!==p);
  const E4=elim(rows[oth[0]],oth[0]+1,rows[p],p+1,0,4),E5=elim(rows[oth[1]],oth[1]+1,rows[p],p+1,0,5);
  L.push(`用 (${p+1}) 消去 $x$：${E4.t}；${E5.t}。`);
  const two=[[E4.r,4],[E5.r,5]],cy=two.filter(t=>t[0][1]!==0),[ry,ly]=cy.reduce((b,t)=>Math.abs(t[0][1])<Math.abs(b[0][1])?t:b,cy[0]),[ro,lo]=two.find(t=>t[1]!==ly);
  const E6=elim(ro,lo,ry,ly,1,6);L.push(`用 (${ly}) 消去 $y$：${E6.t}。`);
  const r6=E6.r;L.push(r6[2]===1?`由 (6) 直接得到 $z = ${X[2]}$。`:`由 (6)：$${poly([[r6[2],'z']])} = ${r6[3]}$，得 $z = ${X[2]}$。`);
  L.push(`代入 (${ly})：$${poly([[ry[1],'y']])} = ${ry[3]} - ${h_pp(ry[2]*X[2])} = ${ry[1]*X[1]}$，得 $y = ${X[1]}$。`);
  const rp=rows[p];L.push(`代入 (${p+1})：$${poly([[rp[0],'x']])} = ${rp[3]} - ${h_pp(rp[1]*X[1])} - ${h_pp(rp[2]*X[2])} = ${rp[0]*X[0]}$，得 $x = ${X[0]}$。`);
  return L;
}

$('seedBtn').addEventListener('click',()=>{const v=parseInt($('seedIn').value,10);if(v>=100000&&v<=999999){state.seed=v;refresh()}else{$('seedIn').value=state.seed}});
$('seedIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('seedBtn').click()});
$('withAns').addEventListener('change',e=>{state.withAns=e.target.checked;save();document.body.classList.toggle('no-ans',!state.withAns)});
$('showTag').addEventListener('change',e=>{state.showTag=e.target.checked;refresh()});

const topLevel=(()=>{try{return window.self===window.top}catch(e){return false}})();
if(topLevel){$('printBtn').hidden=false;$('printBtn').addEventListener('click',()=>window.print())}else{$('printNote').hidden=false}

renderControls();
if(window.__mjReady)render();else{document.addEventListener('mj-ready',render,{once:true});setTimeout(()=>{if(!window.__mjReady)render()},9000)}
</script>
