<script>
/* 這一頁和右上角放大鏡用的是同一份索引（assets/search-index.json）與同一套比對規則，
   差別只在這裡有網址 ?q=，可以把搜尋結果貼給別人。 */
(function(){
  var HOT=["落點分析","備審","APCS","三角函數","因式分解","會考真題","練習卷","段考重點"];
  var q=document.getElementById('q'),out=document.getElementById('out'),DATA=null;
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var terms=function(s){return s.toLowerCase().replace(/\s+/g,' ').trim().split(' ').filter(Boolean)};
  function score(r,ts){var t=r.t.toLowerCase(),s=(r.s||'').toLowerCase(),d=(r.d||'').toLowerCase(),k=(r.k||'').toLowerCase(),sum=0;
    for(var i=0;i<ts.length;i++){var x=ts[i],p=t.indexOf(x);
      if(p===0)sum+=100;else if(p>0)sum+=70;else if(s.indexOf(x)>=0)sum+=40;else if(k.indexOf(x)>=0)sum+=30;else if(d.indexOf(x)>=0)sum+=15;else return -1}
    return sum+(r.w||0)}
  function hl(t,ts){var h=esc(t);ts.forEach(function(x){var i=h.toLowerCase().indexOf(x.toLowerCase());
    if(i>=0)h=h.slice(0,i)+'<mark>'+h.slice(i,i+x.length)+'</mark>'+h.slice(i+x.length)});return h}
  function href(u){return /^https?:/.test(u)?u:'../'+u}
  document.getElementById('tags').innerHTML=HOT.map(function(h){return '<button type="button">'+esc(h)+'</button>'}).join('');
  document.getElementById('tags').addEventListener('click',function(e){
    if(e.target.tagName==='BUTTON'){q.value=e.target.textContent;run()}});
  function run(){
    var v=q.value.trim();
    history.replaceState(null,'',v?'?q='+encodeURIComponent(v):'./');
    if(!v||!DATA){out.innerHTML='';return}
    var ts=terms(v),res=[];
    DATA.forEach(function(r,i){var s=score(r,ts);if(s>=0)res.push([s,i,r])});
    res.sort(function(a,b){return b[0]-a[0]||a[1]-b[1]});
    if(!res.length){out.innerHTML='<p class="sp-empty">找不到「'+esc(v)+'」。換個說法試試，或看 <a href="../learn/">學習中心</a> 的完整清單。</p>';return}
    out.innerHTML='<p class="sp-note" style="margin:16px 0 0">找到 '+res.length+' 筆</p><ul class="sp-res">'+
      res.slice(0,60).map(function(x){var r=x[2];
        return '<li><a href="'+esc(href(r.u))+'"'+(/^https?:/.test(r.u)?' target="_blank" rel="noopener"':'')+'>'+
          '<span class="k">'+esc(r.s)+'</span><b>'+hl(r.t,ts)+'</b><p>'+esc(r.d)+'</p></a></li>'}).join('')+'</ul>';
  }
  q.addEventListener('input',run);
  document.querySelector('.sp-form').addEventListener('submit',function(e){e.preventDefault();run()});
  var init=new URLSearchParams(location.search).get('q')||'';
  if(init)q.value=init;
  fetch('../assets/search-index.json').then(function(r){return r.json()}).then(function(j){DATA=j.d;run()})
    .catch(function(){out.innerHTML='<p class="sp-empty">搜尋索引載入失敗，請重新整理。</p>'});
})();
</script>
