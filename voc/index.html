<style>
:root{
  --ink:#16223a; --ink-2:#44506a; --paper:#f2f4f3; --surface:#fff; --line:#d7dddb;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased}

p{margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:18px}
.label{font:700 12px/1 var(--mono);letter-spacing:.14em;color:var(--brass)}
button{font:inherit;cursor:pointer}

header.top{background:var(--ink);color:var(--paper);padding-block:14px}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top img{width:32px;height:32px;border-radius:50%}

header.top small{color:#aab4c6;font-size:12px}
header.top a.home{margin-left:auto;font-size:13px;color:#cdd6e4;text-decoration:none}

.hero{background:var(--board);color:var(--chalk);padding-block:30px 26px}
.hero h1{font-size:clamp(24px,4.6vw,34px);font-weight:900;margin:10px 0 8px}
.hero p{color:var(--chalk-dim);font-size:15px}
.hero .label{color:#e3c26a}

main{padding-block:26px 90px}
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;text-align:left;width:100%}
.card.sub{border-left:5px solid var(--accent,var(--brass))}
.card h3{font-size:19px;font-weight:900;margin-bottom:4px}
.card .meta{font:500 13px var(--mono);color:var(--ink-2)}
.card .bar{margin-top:12px;height:6px;border-radius:99px;background:#e8ecea;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent,var(--brass))}
.card:hover{border-color:var(--ink)}

.crumb{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}

.qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.qhead .n{font:700 13px var(--mono);color:var(--brass)}
.qhead .score{margin-left:auto;font:700 14px var(--mono);color:var(--ink-2)}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px}
.qbox .q{font-size:18px;font-weight:700;line-height:1.7}
.qimg{margin:2px 0 10px}

var KEY = 'voc_progress_v1';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function chaptersOf(s){ return BANK.filter(function(b){ return b.s === s; }).sort(function(a,b){ return a.ch - b.ch; }); }
function esc(t){ return String(t).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function home(){
  location.hash = '';
  document.getElementById('heroTitle').textContent = '專業科目線上練習';
  document.getElementById('heroSub').textContent = '選科目 → 選章節 → 作答，每題答完立刻批改並顯示詳解。章節依 107 年課綱主題排列：基本電學與電子學是統測專業科目(一)，電工機械是電機類專二，數位邏輯設計、微處理機與程式設計實習是資電類專二；另有基本電學實習、電子學實習兩科實習科目。';
  var p = load();
  var html = '<div class="grid two">';
  SUBJ.forEach(function(sj){
    var chs = chaptersOf(sj.s);

    html += '<button class="card sub" style="--accent:' + sj.color + '" onclick="subject(\'' + sj.s + '\')">' +
      '<h3>' + sj.s + '</h3>' +
      '<div class="meta">' + sj.g + '　·　' + chs.length + ' 章　·　' + total + ' 題</div>' +
      '<div class="bar"><i style="width:' + (total ? Math.round(best / total * 100) : 0) + '%"></i></div>' +
      '<div class="meta" style="margin-top:6px">最佳紀錄 ' + best + ' / ' + total + ' 題答對</div></button>';
  });
  html += '</div>';
  html += '<div class="res"><h3>電機與電子群　理論六科＋實習兩科全部完成</h3>' +
    '<a href="#" onclick="subject(\'基本電學\');return false">基本電學 12 個主題全部完成<small>另加「看圖計算」一章，每題都有電路圖 →</small></a>' +

    '<a href="#" onclick="subject(\'電工機械\');return false">電工機械 9 個主題全部完成<small>直流機、變壓器、感應機、同步機、特殊電機 →</small></a>' +
    '<a href="#" onclick="subject(\'數位邏輯設計\');return false">數位邏輯設計 8 個主題全部完成<small>統測資電類專二　邏輯閘、卡諾圖、正反器、計數器 →</small></a>' +
    '<a href="#" onclick="subject(\'微處理機\');return false">微處理機 8 個主題全部完成<small>統測資電類專二　匯流排、中斷、記憶體、串並列傳輸 →</small></a>' +
    '<a href="#" onclick="subject(\'程式設計實習\');return false">程式設計實習 9 個主題全部完成<small>統測資電類專二　C 語言，每題附程式碼 →</small></a>' +
    '<a href="#" onclick="subject(\'基本電學實習\');return false">基本電學實習 7 個單元全部完成<small>儀表使用、色碼、示波器讀值、家電檢修 →</small></a>' +
    '<a href="#" onclick="subject(\'電子學實習\');return false">電子學實習 12 個單元全部完成<small>元件判別、整流濾波、放大電路、OP 應用、振盪 →</small></a>' +
    '<a href="#" onclick="exams();return false">統測歷屆真題 111～115<small>專一與專二共 15 份整卷，原題＋官方答案 →</small></a>' +
    '<a href="../practice/#/tc/C" >統測數學 C 歷屆真題<small>已經上線，375 題附逐題詳解 →</small></a>' +
    '</div>' +
    '<p class="note">想先練數學？官網的<a href="../practice/">正賦線上練習</a>有國中、高中、技高數學 A／B／C 的單元練習與統測真題。</p>';

function subject(s){
  var sj = SUBJ.filter(function(x){ return x.s === s; })[0];
  document.getElementById('heroTitle').textContent = s;
  document.getElementById('heroSub').textContent = sj.g + '　·　依課本章節排列，先練單元、再練整章';
  var p = load();
  var html = '<div class="crumb"><button onclick="home()">← 所有科目</button><span>/</span><span>' + s + '</span></div><div class="grid">';
  chaptersOf(s).forEach(function(c){
    var rec = p[c.id] || {};
    var best = rec.best || 0;
    html += '<button class="card sub" style="--accent:' + sj.color + '" onclick="start(\'' + c.id + '\')">' +
      '<h3>第 ' + c.ch + ' 章　' + c.u + '</h3>' +
      '<div class="meta">' + c.items.length + ' 題' + (rec.best !== undefined ? '　·　最佳 ' + best + ' / ' + c.items.length : '　·　尚未練習') + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(best / c.items.length * 100) + '%"></i></div></button>';
  });
  html += '</div>';
  html += '<div class="res"><h3>' + s + '　其他資源</h3>' +
    '<a href="https://line.me/ti/p/~jenfoo2021" target="_blank" rel="noopener">段考備戰包 PDF<small>重點講義、模擬試卷、詳解——加 LINE 留言「' + sj.pdf + '」索取</small></a>' +
    '<a href="' + sj.yt + '" target="_blank" rel="noopener">莊老數學教室<small>段考複習影片與單元講解 →</small></a>' +
    '</div>';
  view.innerHTML = html;
}


/* ---------- 電路圖：由題目的 fig 規格畫成 SVG ---------- */
var INK = '#16223a', GOLD = '#a8822a';
function sv(w, h, body){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img" ' +
    'style="stroke:' + INK + ';fill:none;stroke-width:2;stroke-linecap:round">' + body + '</svg>';
}
function wire(x1, y1, x2, y2){ return '<path d="M' + x1 + ' ' + y1 + 'H' + x2 + 'V' + y2 + '"/>'; }
function line(x1, y1, x2, y2){ return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>'; }
function label(x, y, t, col){ return '<text x="' + x + '" y="' + y + '" text-anchor="middle" fill="' + (col || INK) + '" stroke="none" font-size="13">' + t + '</text>'; }
/* 電阻：水平方框 */
function resH(x, y, t){
  return '<rect x="' + x + '" y="' + (y - 11) + '" width="54" height="22" rx="3" fill="#fff"/>' + label(x + 27, y + 5, t);
}
/* 電阻：垂直方框 */
function resV(x, y, t){
  return '<rect x="' + (x - 11) + '" y="' + y + '" width="22" height="54" rx="3" fill="#fff"/>' +
         label(x + 30, y + 32, t);
}
/* 電池（直流電源），畫在左側 */
function battery(x, y, t){
  return line(x, y - 16, x, y + 16).replace('stroke-width', 'data-x') +
    '<line x1="' + x + '" y1="' + (y - 16) + '" x2="' + x + '" y2="' + (y + 16) + '" stroke-width="3"/>' +
    '<line x1="' + (x - 9) + '" y1="' + (y - 8) + '" x2="' + (x - 9) + '" y2="' + (y + 8) + '"/>' +
    label(x - 2, y - 24, '+', GOLD) + label(x - 34, y + 5, t, GOLD);
}
function arrowDefs(){
  return '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">' +
    '<path d="M0 0 L9 4.5 L0 9 z" fill="' + GOLD + '" stroke="none"/></marker></defs>';
}
function drawFig(f){
  if (!f) return '';
  var b = '', i, x;
  if (f.t === 'series'){                      // 電源 + 數個串聯電阻
    var n = f.r.length, W = 120 + n * 90, H = 150;
    b = battery(50, 75, f.v);
    b += '<path d="M50 59V35H' + (W - 40) + 'V115H50V91"/>';
    for (i = 0; i < n; i++){
      x = 95 + i * 90;
      b += '<rect x="' + x + '" y="24" width="54" height="22" rx="3" fill="#fff"/>' + label(x + 27, 18, f.r[i]);
    }
    return sv(W, H, b);
  }
  if (f.t === 'parallel'){                    // 電源 + 數條並聯支路
    var m = f.r.length, W2 = 140 + m * 95, H2 = 170;
    b = battery(50, 85, f.v);
    b += '<path d="M50 69V35H' + (60 + m * 95) + '"/>';
    b += '<path d="M50 101V135H' + (60 + m * 95) + '"/>';
    for (i = 0; i < m; i++){
      x = 120 + i * 95;
      b += line(x, 35, x, 58) + line(x, 112, x, 135) + resV(x, 58, f.r[i]);
    }
    b += line(60 + m * 95, 35, 60 + m * 95, 135);
    return sv(W2, H2, b);
  }
  if (f.t === 'sp'){                          // R1 串聯（R2 並聯 R3）
    b = battery(50, 85, f.v);
    b += '<path d="M50 69V35H120"/>' + '<rect x="120" y="24" width="54" height="22" rx="3" fill="#fff"/>' + label(147, 18, f.r1);
    b += '<path d="M174 35H250"/>';
    b += line(250, 35, 250, 58) + resV(250, 58, f.r2) + line(250, 112, 250, 135);
    b += line(330, 35, 330, 58) + resV(330, 58, f.r3) + line(330, 112, 330, 135);
    b += '<path d="M250 35H390V135H250"/>';
    b += '<path d="M50 101V135H250"/>';
    return sv(420, 170, b);
  }
  if (f.t === 'sp2'){                         // （R1 並聯 R2）再串聯 R3
    b = battery(50, 85, f.v);
    b += '<path d="M50 69V35H130"/>';
    b += line(130, 35, 130, 58) + resV(130, 58, f.r1) + line(130, 112, 130, 135);
    b += line(210, 35, 210, 58) + resV(210, 58, f.r2) + line(210, 112, 210, 135);
    b += '<path d="M130 35H210"/><path d="M130 135H210"/>';
    b += '<path d="M210 35H270"/>' + '<rect x="270" y="24" width="54" height="22" rx="3" fill="#fff"/>' + label(297, 18, f.r3);
    b += '<path d="M324 35H390V135H50V101"/>';
    b += '<path d="M210 135H50"/>';
    return sv(420, 170, b);
  }
  if (f.t === 'ladder'){                      // R1 串聯（R2 並聯 R3）再串聯 R4
    b = battery(50, 85, f.v);
    b += '<path d="M50 69V35H110"/>' + '<rect x="110" y="24" width="48" height="22" rx="3" fill="#fff"/>' + label(134, 18, f.r1);
    b += '<path d="M158 35H230"/>';
    b += line(230, 35, 230, 58) + resV(230, 58, f.r2) + line(230, 112, 230, 135);
    b += line(310, 35, 310, 58) + resV(310, 58, f.r3) + line(310, 112, 310, 135);
    b += '<path d="M230 35H310"/><path d="M230 135H310"/>';
    b += '<path d="M310 35H370"/>' + '<rect x="370" y="24" width="48" height="22" rx="3" fill="#fff"/>' + label(394, 18, f.r4);
    b += '<path d="M418 35H470V135H50V101"/>';
    b += '<path d="M310 135H50"/>';
    return sv(500, 170, b);
  }
  if (f.t === 'meter'){                       // 串聯電路 + 安培計或伏特計
    b = battery(50, 85, f.v);
    b += '<path d="M50 69V35H120"/>' + '<rect x="120" y="24" width="54" height="22" rx="3" fill="#fff"/>' + label(147, 18, f.r1);
    b += '<path d="M174 35H250"/>' + '<rect x="250" y="24" width="54" height="22" rx="3" fill="#fff"/>' + label(277, 18, f.r2);
    b += '<path d="M304 35H370V135H50V101"/>';
    if (f.m === 'A'){                         // 安培計串聯在迴路上
      b += '<circle cx="210" cy="135" r="16" fill="#fff"/>' + label(210, 140, 'A', GOLD);
      b += '<path d="M50 135H194"/><path d="M226 135H370"/>';
    } else {                                  // 伏特計並聯在 R2 兩端
      b += '<circle cx="277" cy="95" r="16" fill="#fff"/>' + label(277, 100, 'V', GOLD);
      b += line(250, 35, 250, 79) + line(250, 79, 261, 95);
      b += line(304, 35, 304, 79) + line(304, 79, 293, 95);
    }
    return sv(400, 170, b);
  }
  if (f.t === 'divider'){                     // 分壓器：R1 上、R2 下，輸出取在 R2 兩端
    b = battery(50, 90, f.v);
    b += '<path d="M50 74V30H170"/>';
    b += '<rect x="159" y="30" width="22" height="50" rx="3" fill="#fff"/>' + label(205, 60, f.r1);
    b += '<rect x="159" y="100" width="22" height="50" rx="3" fill="#fff"/>' + label(205, 130, f.r2);
    b += '<path d="M170 80V100"/>';
    b += '<circle cx="170" cy="90" r="4" fill="' + INK + '"/>';
    b += '<path d="M170 90H280"/>' + label(300, 95, 'Vo', GOLD);
    b += '<path d="M170 150V170H50V106"/>';
    b += '<path d="M170 170H280"/>' + label(300, 175, 'GND');
    return sv(340, 200, b);
  }
  if (f.t === 'node'){                        // KCL 節點
    b = arrowDefs();
    b += '<circle cx="160" cy="70" r="5" fill="' + INK + '"/>';
    (f.inn || []).forEach(function(t, k){
      var y = 40 + k * 60;
      b += '<line x1="40" y1="' + y + '" x2="150" y2="70" marker-end="url(#ar)" stroke="' + GOLD + '"/>' + label(70, y - 8, t, GOLD);
    });
    (f.out || []).forEach(function(t, k){
      var y2 = 40 + k * 60;
      b += '<line x1="170" y1="70" x2="285" y2="' + y2 + '" marker-end="url(#ar)" stroke="' + GOLD + '"/>' + label(265, y2 - 8, t, GOLD);
    });
    b += label(160, 95, f.name || 'A');
    return sv(320, 150, b);
  }
  if (f.t === 'bridge'){                      // 惠斯登電橋
    b = '<path d="M160 20L60 85L160 150L260 85Z"/>';
    b += label(95, 45, f.p) + label(230, 45, f.q) + label(95, 135, f.r) + label(230, 135, f.s);
    b += '<circle cx="160" cy="85" r="14" fill="#fff"/>' + label(160, 90, 'G');
    b += '<path d="M60 85H146"/><path d="M174 85H260"/>';
    b += label(160, 14, '＋') + label(160, 168, '－');
    return sv(320, 180, b);
  }
  return '';
}


/* ===== 統測歷屆真題 ===== */
if (typeof EXAM === 'undefined') { var EXAM = []; }
var PAPER = {P1: '專業科目(一)', E2: '專業科目(二)　電機類', I2: '專業科目(二)　資電類'};

function exams(){
  document.getElementById('heroTitle').textContent = '統測歷屆真題';
  document.getElementById('heroSub').textContent =
    '技專校院入學測驗中心公告的原題，111～115 學年度電機與電子群，一卷 50 題。'
    + '專業科目(一)兩類共同考，專業科目(二)依科別分電機類與資電類。答案為官方公告標準答案。';
  var html = '<div class="crumb"><button onclick="home()">← 所有科目</button><span>/</span><span>統測歷屆真題</span></div>';
  var p = load();
  ['P1', 'E2', 'I2'].forEach(function(k){
    var list = EXAM.filter(function(e){ return e.p === k; })
                   .sort(function(a, b){ return b.y - a.y; });
    if (!list.length) return;
    html += '<div class="res"><h3>' + PAPER[k] + '　' + esc(list[0].sub) + '</h3><div class="papers">';
    list.forEach(function(e){
      var rec = p[e.code] || {};
      html += '<a href="#" onclick="startExam(\'' + e.code + '\');return false">'
           + e.y + ' 學年度<small>' + e.items.length + ' 題'
           + (rec.best !== undefined ? '　·　最佳 ' + rec.best : '　·　尚未作答') + '</small></a>';
    });
    html += '</div></div>';
  });
  html += '<p class="note">原題與標準答案來自技專校院入學測驗中心公告試題，僅供同學練習使用。'
       + '答完會列出答錯的題號，可以對照講義或直接問莊老師。</p>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function startExam(code){
  var e = EXAM.filter(function(x){ return x.code === code; })[0];
  if (!e) return exams();
  cur = {ex: e, i: 0, right: 0, wrong: [], picked: null};
  document.getElementById('heroTitle').textContent = e.y + ' 統測　' + PAPER[e.p];
  document.getElementById('heroSub').textContent = e.sub + '　·　共 ' + e.items.length + ' 題，每題 2 分';
  renderExam();
}

function renderExam(){
  var e = cur.ex, it = e.items[cur.i];
  var html = '<div class="crumb"><button onclick="home()">所有科目</button><span>/</span>'
    + '<button onclick="exams()">統測歷屆真題</button><span>/</span><span>' + e.y + ' ' + PAPER[e.p] + '</span></div>';
  html += '<div class="qhead"><span class="n">第 ' + (cur.i + 1) + ' / ' + e.items.length + ' 題</span>'
    + '<span class="score">答對 ' + cur.right + '</span></div>';
  html += '<div class="qbox">';
  if (it.stem) html += '<div class="qimg stem"><img src="img/' + it.stem + '" alt="共用題幹" loading="lazy"></div>';
  html += '<div class="qimg"><img src="img/' + it.img + '" alt="第 ' + it.n + ' 題" loading="lazy"></div>';
  html += '<div class="opts">';
  'ABCD'.split('').forEach(function(L, k){
    var cls = 'opt';
    if (cur.picked !== null) {
      if (it.ans.indexOf(L) >= 0) cls += ' right';
      else if (k === cur.picked) cls += ' wrong';
    }
    html += '<button class="' + cls + '"' + (cur.picked !== null ? ' disabled' : '')
      + ' onclick="pickExam(' + k + ')"><b>(' + L + ')</b><span>選 ' + L + '</span></button>';
  });
  html += '</div>';
  if (cur.picked !== null) {
    var ok = it.ans.indexOf('ABCD'[cur.picked]) >= 0;
    var ansTxt = it.ans.length === 4 ? '本題送分，選任一個都算對'
               : it.ans.split('').map(function(L){ return '(' + L + ')'; }).join(' 或 ');
    html += '<div class="sol"><b class="tag ' + (ok ? 'ok' : 'no') + '">' + (ok ? '答對了' : '再看一次') + '</b><br>'
      + '<b>官方答案：' + ansTxt + '</b>' + (it.note ? '　' + esc(it.note) : '')
      + (it.sol ? '<br>' + esc(it.sol) : '') + '</div>';
    html += '<div class="nav"><button class="btn main" onclick="nextExam()">'
      + (cur.i + 1 < e.items.length ? '下一題 →' : '看成績 →') + '</button></div>';
  }
  html += '</div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function pickExam(k){
  if (cur.picked !== null) return;
  cur.picked = k;
  var it = cur.ex.items[cur.i];
  if (it.ans.indexOf('ABCD'[k]) >= 0) cur.right++; else cur.wrong.push(it.n);
  renderExam();
}

function nextExam(){
  cur.picked = null;
  cur.i++;
  if (cur.i < cur.ex.items.length) return renderExam();
  finishExam();
}

function finishExam(){
  var e = cur.ex, p = load(), rec = p[e.code] || {};
  if (!rec.best || cur.right > rec.best) rec.best = cur.right;
  rec.last = cur.right; p[e.code] = rec; save(p);
  var score = cur.right * 2;
  var msg = score >= 90 ? '這個分數在統測屬於前段，保持住。'
          : score >= 70 ? '底子有了，把錯的那幾題的觀念補起來分數還會再上去。'
          : score >= 50 ? '一半多一點，先回單元練習把錯最多的那一科重練一次。'
                        : '先從單元練習開始，整卷之後再回來考。';
  var html = '<div class="crumb"><button onclick="home()">所有科目</button><span>/</span>'
    + '<button onclick="exams()">統測歷屆真題</button></div>';
  html += '<div class="done"><div class="big">' + score + ' 分</div>'
    + '<p>答對 ' + cur.right + ' / ' + e.items.length + ' 題　·　' + msg + '</p>';
  if (cur.wrong.length) {
    html += '<div class="wrongbox"><h4>答錯的題號</h4><ul><li>'
      + cur.wrong.join('、') + '</li></ul></div>';
  }
  html += '<div class="nav" style="justify-content:center">'
    + '<button class="btn main" onclick="startExam(\'' + e.code + '\')">再考一次</button>'
    + '<button class="btn ghost" onclick="exams()">換一年</button>'
    + '<a class="btn line" href="https://line.me/ti/p/~jenfoo2021" target="_blank" rel="noopener">問莊老師</a>'
    + '</div></div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

var cur = null;
function start(id){
  var c = BANK.filter(function(b){ return b.id === id; })[0];
  if (!c) return home();
  cur = {c: c, i: 0, right: 0, wrong: [], picked: null};
  document.getElementById('heroTitle').textContent = c.s + '　第 ' + c.ch + ' 章';
  document.getElementById('heroSub').textContent = c.u + '　·　共 ' + c.items.length + ' 題';
  render();
}

function render(){
  var c = cur.c, it = c.items[cur.i];
  var html = '<div class="crumb"><button onclick="home()">所有科目</button><span>/</span>' +
    '<button onclick="subject(\'' + c.s + '\')">' + c.s + '</button><span>/</span><span>第 ' + c.ch + ' 章</span></div>';
  html += '<div class="qhead"><span class="n">第 ' + (cur.i + 1) + ' / ' + c.items.length + ' 題</span>' +
    '<span class="score">答對 ' + cur.right + '</span></div>';
  html += '<div class="qbox"><div class="q">' + esc(it.q) + '</div>';
  if (it.code) html += '<pre class="code">' + esc(it.code) + '</pre>';
  if (it.fig) html += '<div class="fig">' + drawFig(it.fig) + '</div>';
  html += '<div class="opts">';
  it.opts.forEach(function(o, k){
    var cls = 'opt';
    if (cur.picked !== null) {
      if (k === it.ans) cls += ' right';
      else if (k === cur.picked) cls += ' wrong';
    }
    html += '<button class="' + cls + '"' + (cur.picked !== null ? ' disabled' : '') +
      ' onclick="pick(' + k + ')"><b>(' + 'ABCD'[k] + ')</b><span>' + esc(o) + '</span></button>';
  });
  html += '</div>';
  if (cur.picked !== null) {
    var ok = cur.picked === it.ans;
    html += '<div class="sol"><b class="tag ' + (ok ? 'ok' : 'no') + '">' + (ok ? '答對了' : '再看一次') + '</b><br>' +
      '<b>答案：(' + 'ABCD'[it.ans] + ')</b>　' + esc(it.sol) + '</div>';
    html += '<div class="nav"><button class="btn main" onclick="next()">' +
      (cur.i + 1 < c.items.length ? '下一題 →' : '看成績 →') + '</button></div>';
  }
  html += '</div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function pick(k){
  if (cur.picked !== null) return;
  cur.picked = k;
  var it = cur.c.items[cur.i];
  if (k === it.ans) cur.right++; else cur.wrong.push(cur.i);
  render();
}

function next(){
  cur.picked = null;
  cur.i++;
  if (cur.i < cur.c.items.length) return render();
  finish();
}

function finish(){
  var c = cur.c, p = load(), rec = p[c.id] || {};
  if (!rec.best || cur.right > rec.best) rec.best = cur.right;
  rec.last = cur.right; p[c.id] = rec; save(p);
  var pct = Math.round(cur.right / c.items.length * 100);
  var msg = pct === 100 ? '全對，這一章可以放心了。' :
            pct >= 80 ? '底子穩，把錯的那幾題觀念補起來就好。' :
            pct >= 60 ? '一半以上會了，錯的集中複習一次再考一遍。' :
                        '先回去看講義這一章，再回來重練一次。';
  var html = '<div class="crumb"><button onclick="home()">所有科目</button><span>/</span>' +
    '<button onclick="subject(\'' + c.s + '\')">' + c.s + '</button></div>';
  html += '<div class="done"><div class="big">' + cur.right + ' / ' + c.items.length + '</div>' +
    '<p>' + msg + '</p>';
  if (cur.wrong.length) {
    html += '<div class="wrongbox"><h4>錯的題目</h4><ul>';
    cur.wrong.forEach(function(i){ html += '<li>第 ' + (i + 1) + ' 題　' + esc(c.items[i].q.slice(0, 32)) + '…</li>'; });
    html += '</ul></div>';
  }
  html += '<div class="nav" style="justify-content:center">' +
    '<button class="btn main" onclick="start(\'' + c.id + '\')">再練一次</button>' +
    '<button class="btn ghost" onclick="subject(\'' + c.s + '\')">換一章</button>' +
    '<a class="btn line" href="https://line.me/ti/p/~jenfoo2021" target="_blank" rel="noopener">問莊老師</a>' +
    '</div></div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

home();
</script>
